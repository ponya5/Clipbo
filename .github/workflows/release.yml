name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Create the release once; otherwise each matrix job creates its own duplicate.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release view <tag>` cannot see drafts, so list releases instead.
      - run: gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release:
    needs: draft
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
