<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
  <link rel="stylesheet" href="styles.css">
  <title>Clipbo</title>
</head>
<body>
  <header>
    <nav id="tabs">
      <button data-tab="history" class="tab">History</button>
      <button data-tab="vault" class="tab">Vault</button>
      <button data-tab="settings" class="tab tab-icon" title="Settings &amp; About" aria-label="Settings">⚙</button>
    </nav>
    <input id="search" type="text" autocomplete="off" spellcheck="false">
  </header>
  <main>
    <ul id="list"></ul>
    <section id="overlay" hidden></section>
  </main>
  <footer>
    <div id="hints"></div>
    <span id="version"></span>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
